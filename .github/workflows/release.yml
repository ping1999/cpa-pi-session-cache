name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: Integration with official CPA (mock upstream)
        run: python3 tests/integration.py
      - run: python3 scripts/package.py amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            dist/*.zip
            dist/checksums.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - run: gh release create "$TAG" dist/*.zip dist/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
